<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUS LAPTOP PRICE SLIDER PAGE</title>
    <link rel="stylesheet" href="slider.css">
</head>
<body>
    <div class="main">
        <div class="title">
            <h1>ASUS LAPTOPS</h1>
        </div>
        <div class="slide">
            <h3 class="slide-head">laptop price range</h3>
        </div>
        <div class="hero">
            <div class="min">
                <span>minimum price</span>
            <input type="number" class="min-input" value="2500">
            </div>
            <div class="max">
             <span>maximum price</span>
            <input type="number" class="max-input" value="100000">
            </div>
        </div>
        <!-- slider -->
         <div class="slider">
            <input type="range" class="min-range" min="0" max="100000" value="2500" step="1">
            <input type="range" class="max-range" min="0" max="100000" value="75000" step="1">
         </div>
    </div>
</body>
</html>
